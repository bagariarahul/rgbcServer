version: '3.8'

services:

  # 1. The Cloudflare Tunnel Service
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    # We define the routing here, bypassing the UI validation
    command: tunnel --no-autoupdate run --url http://app:3000
    depends_on:
      - app

  # 2. The Backend API
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Database — all secrets sourced from .env via Docker Compose interpolation
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Redis
      - REDIS_HOST=redis
      # Storage paths (absolute container paths)
      - UPLOAD_PATH=/app/storage/uploads
      - TEMP_PATH=/app/storage/temp
      # Authentication secrets
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # ──────────────────────────────────────────────────────────────
      # DB_RESET and DB_SYNC are intentionally REMOVED.
      # The app now uses sync({ force: false, alter: false }) which
      # only creates missing tables and never drops or alters data.
      # For schema changes, use Sequelize CLI migrations.
      # ──────────────────────────────────────────────────────────────
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - /app/node_modules
      - app_storage:/app/storage

  # 3. PostgreSQL Database (Isolated)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Redis Cache
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  app_storage: